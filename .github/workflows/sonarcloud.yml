name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.ref }}
  # A push to main is the run that publishes coverage; superseded runs there would never finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  sonarcloud:
    # Track shared CI improvements on main.
    uses: storytold/bharat-common-actions/.github/workflows/sonarcloud.yml@main
    with:
      pdf-test-fonts: true
      # The codec and format code behind features that are off by default. Without these the
      # coverage build never compiles it, and new code there reads as untested.
      cargo-features: >-
        bharat-video/dnx,bharat-video/vp8,bharat-video/prores,bharat-video/h264,bharat-video/hevc,bharat-video/vp9,bharat-video/av1,bharat-video/threads,bharat-audio/decode,bharat-audio/encode,bharat-audio/peaks,bharat-audio/rayon,bharat-audio/serde,bharat-media/matroska,bharat-media/ogg,bharat-media/bitstream,bharat-media/serde,bharat-mesh/stl,bharat-mesh/obj,bharat-mesh/ply,bharat-mesh/gltf,bharat-metafile/write
    secrets: inherit
