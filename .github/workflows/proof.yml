name: Proofing

on:
  push:
    branches: [main]
    paths: ["crates/proof/**", "Cargo.toml", "Cargo.lock", ".github/workflows/proof.yml"]
  pull_request:
    paths: ["crates/proof/**", "Cargo.toml", "Cargo.lock", ".github/workflows/proof.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests share one group per branch, so a newer push cancels the older run. Every other
  # run (main, manual) gets its own group: it is never cancelled or replaced while queued, so it
  # always gets to save the cache.
  group: bharat-proof-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    timeout-minutes: 20
    name: Proofing lint, tests with and without Language data, WASM
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The Language data (bharat-i18n `language-data/`), embedded by crates/proof/build.rs.
      # Pinned to obone32/bharat-i18n#114's head (#109's SCOWL dictionaries + judgment/judgement,
      # CP2.1); TODO(CP2.1): move to #114's merge commit once it merges.
      - uses: actions/checkout@v7.0.1
        with:
          repository: obone32/bharat-i18n
          ref: c239f934ace90b7939afaceb23b472ceeafd6b8a
          path: bharat-i18n
          persist-credentials: false
      - uses: step-security/dtolnay-rust-toolchain@v1.0.0
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: step-security/rust-cache@v2.9.2
        with:
          key: bharat-proof
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt -p bharat-proof --check
      - name: Without Language data (a fork, docs.rs, offline)
        run: |
          cargo clippy -p bharat-proof --all-targets --locked -- -D warnings
          cargo test -p bharat-proof --locked
          cargo check -p bharat-proof --locked --target wasm32-unknown-unknown
      - name: A release without Language data fails
        run: |
          if BHARAT_I18N_REQUIRED=1 cargo check -p bharat-proof --locked 2>build.log; then
            echo "::error::BHARAT_I18N_REQUIRED=1 without BHARAT_I18N_DIR built"; exit 1
          fi
          grep -q "BHARAT_I18N_REQUIRED=1 but BHARAT_I18N_DIR is unset" build.log
      - name: With Language data
        env:
          BHARAT_I18N_DIR: ${{ github.workspace }}/bharat-i18n
          BHARAT_I18N_REQUIRED: "1"
        run: |
          cargo clippy -p bharat-proof --all-targets --locked -- -D warnings
          cargo test -p bharat-proof --locked
          cargo check -p bharat-proof --locked --target wasm32-unknown-unknown
      - name: The English-only build (BHARAT_PROOF_EMBED=en, CP4.4's default once Language packs ship)
        env:
          BHARAT_I18N_DIR: ${{ github.workspace }}/bharat-i18n
          BHARAT_I18N_REQUIRED: "1"
          BHARAT_PROOF_EMBED: en
        run: cargo test -p bharat-proof --locked
