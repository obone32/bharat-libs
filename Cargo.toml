[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/krilla", "vendor/hayro", "vendor/hayro-interpret", "vendor/hayro-syntax", "vendor/hayro-jbig2", "vendor/hayro-cmap", "vendor/hayro-postscript"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/obone32/bharat-libs"

[workspace.dependencies]
# internal: add each crate here as `bharat-<name> = { path = "crates/<name>" }`
bharat-platform = { path = "crates/platform" }
bharat-ai-core = { path = "crates/ai-core" }
bharat-pdf = { path = "crates/pdf", version = "=0.1.0" }
bharat-plate-test = { path = "crates/plate-test" }
krilla = { version = "=0.8.2", default-features = false, features = ["raster-images"] }
hayro = { version = "=0.7.1", default-features = false }
hayro-interpret = { version = "=0.7.0", default-features = false, features = ["embed-fonts", "embed-cmaps"] }
hayro-syntax = { version = "=0.7.2", default-features = false, features = ["std"] }
bytemuck = "1"
kurbo = "0.13"
thiserror = "2"
bharat-atomic = { path = "crates/atomic" }
bharat-cms = { path = "crates/cms" }
bharat-crw = { path = "crates/crw" }
bharat-dialogs = { path = "crates/dialogs" }
bharat-doc = { path = "crates/doc" }
bharat-docpath = { path = "crates/docpath" }
bharat-ecproj-format = { path = "crates/ecproj-format" }
bharat-font-catalog = { path = "crates/font-catalog" }
bharat-font-manager = { path = "crates/font-manager" }
bharat-font-store = { path = "crates/font-store" }
bharat-fonts-build = { path = "crates/fonts-build" }
bharat-i18n = { path = "crates/i18n" }
bharat-jpeg = { path = "crates/jpeg" }
bharat-keymap = { path = "crates/keymap" }
bharat-audio = { path = "crates/audio" }
# No default features, so bharat-audio's `encode` builds bharat-media without `isobmff`.
bharat-media = { path = "crates/media", default-features = false }
bharat-media-testkit = { path = "crates/media-testkit" }
bharat-menu = { path = "crates/menu" }
bharat-pcraft-format = { path = "crates/pcraft-format" }
bharat-prepress = { path = "crates/prepress" }
bharat-print = { path = "crates/print" }
bharat-proof = { path = "crates/proof" }
bharat-quit = { path = "crates/quit" }
bharat-settings = { path = "crates/settings" }
bharat-text = { path = "crates/text" }
bharat-ui = { path = "crates/ui" }
bharat-update = { path = "crates/update" }
bharat-vectorcraft-format = { path = "crates/vectorcraft-format" }
bharat-web-api = { path = "crates/web-api" }
bharat-window = { path = "crates/window" }
bharat-web-host = { path = "crates/web-host" }
egui = { version = "0.37", default-features = false }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(bharat_pdf_unicode_fixtures)"] }

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[patch.crates-io]
krilla = { path = "vendor/krilla" }

hayro = { path = "vendor/hayro" }
hayro-interpret = { path = "vendor/hayro-interpret" }
hayro-syntax = { path = "vendor/hayro-syntax" }
hayro-jbig2 = { path = "vendor/hayro-jbig2" }
hayro-cmap = { path = "vendor/hayro-cmap" }
hayro-postscript = { path = "vendor/hayro-postscript" }
ecolor = { git = "https://github.com/obone32/bharat-egui", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/obone32/bharat-egui", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/obone32/bharat-egui", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/obone32/bharat-egui", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/obone32/bharat-egui", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/obone32/bharat-egui", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/obone32/bharat-egui", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/obone32/bharat-egui", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/obone32/bharat-egui", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/obone32/bharat-egui", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_system_font_provider = { git = "https://github.com/obone32/bharat-egui", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/obone32/bharat-egui", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_demo_lib = { git = "https://github.com/obone32/bharat-egui", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_inspection = { git = "https://github.com/obone32/bharat-egui", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/obone32/bharat-winit", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }

# symphonia's FLAC decoder restores LPC samples as `residual + (prediction as i32)`. In a valid
# 32-bit stream the prediction can leave the i32 range while the sum does not, so a debug build
# panics where a release build wraps to the right sample. Apps that decode 32-bit FLAC through
# bharat-audio's `decode` need the same override in their own workspace.
[profile.dev.package.symphonia-bundle-flac]
overflow-checks = false
