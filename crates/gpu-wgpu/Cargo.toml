[package]
name = "bharat-gpu-wgpu"
description = "bharat-gpu backend using wgpu (WebGPU on wasm32, native APIs on desktop)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
bharat-gpu = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgpu"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { workspace = true, optional = true }
wgpu = { workspace = true }

[features]
default = []
adapter-probe = ["dep:pollster"]
native-vulkan = ["wgpu/vulkan"]
native-dx12 = ["wgpu/dx12"]
native-metal = ["wgpu/metal"]
native-gles = ["wgpu/gles"]

[dev-dependencies]
pollster = { workspace = true }
# Real-backend test (crates/gpu-wgpu/src/tests.rs): dispatches bharat-gpu-providers' CPU-stand-in
# providers against a real WgpuContext, not just bharat-gpu-null, per RFC-0022 acceptance
# requirement 2. Dev-only: no cycle (bharat-gpu-providers never depends on bharat-gpu-wgpu).
bharat-gpu-providers = { workspace = true }
