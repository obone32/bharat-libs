[package]
name = "bharat-prepress"
description = "Prepress for the Bharat apps: ink model, per-ink plates rendered from a PDF, coverage, ink limits and composite preview"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
bharat-pdf = { workspace = true, features = ["raster", "write"] }
bharat-cms = { workspace = true }
thiserror = { workspace = true }
kurbo = { workspace = true, optional = true }
linesweeper = { version = "0.5", optional = true }
ttf-parser = { version = "=0.25.1", optional = true }

[dev-dependencies]
bharat-plate-test = { workspace = true }
ttf-parser = "=0.25.1"

[features]
# The transparency flattener.
flatten = ["bharat-pdf/write-pdf", "dep:kurbo", "dep:linesweeper", "dep:ttf-parser"]
