[package]
name = "bharat-file-formats"
description = "Shared bounded file signature and extension resolution for Bharat applications"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
bharat-eps = { workspace = true }
bharat-image-codecs = { workspace = true, optional = true }
bharat-raw = { workspace = true, optional = true }
bharat-ora = { workspace = true, optional = true }
bharat-kra = { workspace = true, optional = true }
bharat-pcraft-bundle = { workspace = true, optional = true }
bharat-idml = { workspace = true }
bharat-svg = { workspace = true }
bharat-zip = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
# These flags report which shared parser/codec families a client builds. The application still
# selects the corresponding shared crates in its dependency graph.
raster-codecs = ["dep:bharat-image-codecs"]
heif = ["raster-codecs", "bharat-image-codecs/heif"]
avif = ["raster-codecs", "bharat-image-codecs/avif"]
pdf = []
svg = []
ora = ["dep:bharat-ora"]
kra = ["dep:bharat-kra"]
xcf = []
pdn = []
raw = ["dep:bharat-raw"]
psd = []
affinity = []
pcraft = ["dep:bharat-pcraft-bundle"]
ase = []
office = []
designcraft = []
stencilcraft = []
plotter = []

[lints]
workspace = true
