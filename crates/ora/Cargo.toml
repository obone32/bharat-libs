[package]
name = "bharat-ora"
description = "OpenRaster documents (.ora): the ZIP archive and the stack.xml layer tree, read with bounded sizes and written."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
bharat-xml = { workspace = true }
thiserror = { workspace = true }
bharat-zip = { workspace = true }

[dev-dependencies]
# The tests build archives, hostile ones included, by hand.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
bharat-zip = { workspace = true, features = ["test-support"] }
