[package]
name = "bharat-html"
description = "The bottom layer of reading and writing HTML: a tolerant tokenizer, character references, escaping and the charset a page declares. No tree, no CSS, no rendering."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# HTML documents: read into and written from the bharat-flow model and a bharat-wordmodel Document.
flow = ["dep:bharat-codepage", "dep:bharat-flow", "dep:bharat-math", "dep:bharat-mime", "dep:bharat-wordmodel", "dep:encoding_rs"]

[dependencies]
bharat-codepage = { workspace = true, optional = true }
bharat-flow = { workspace = true, optional = true }
bharat-math = { workspace = true, optional = true }
bharat-mime = { workspace = true, features = ["detect"], optional = true }
bharat-wordmodel = { workspace = true, optional = true }
encoding_rs = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }

[[test]]
name = "doc"
required-features = ["flow"]
