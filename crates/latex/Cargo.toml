[package]
name = "bharat-latex"
description = "LaTeX documents read and written: the everyday subset (sections, lists, tables, math, formatting, links) to and from the bharat-flow model, and a standalone article that compiles with any TeX distribution."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
bharat-flow = { workspace = true }
bharat-math = { workspace = true }
# Text that names no encoding: BOM, UTF-16, UTF-8, else the legacy encoding it looks like.
bharat-mime = { workspace = true, features = ["detect"] }
bharat-wordmodel = { workspace = true }

[dev-dependencies]
bharat-markdown = { workspace = true }

proptest = { workspace = true }
